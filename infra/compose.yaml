name: blt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blt}
      POSTGRES_USER: ${POSTGRES_USER:-blt}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blt} -d ${POSTGRES_DB:-blt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One image for Compose and Railway: stock Gitea plus a bootstrap that creates the accounts.
  gitea:
    build: ./gitea
    image: blt-gitea
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__security__INSTALL_LOCK: "true"
      # The shared local password may be shorter than the 8 characters Gitea wants by default.
      GITEA__security__MIN_PASSWORD_LENGTH: "6"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      # The bootstrap creates blt, ballast and lane with the shared password (a secret file), and resets
      # it on every start, so a rotation only needs this container recreated.
      GITEA_USER: ${GITEA_USER:-blt}
      GITEA_EMAIL: ${GITEA_EMAIL:-blt@mail.com}
    ports:
      - "127.0.0.1:${GITEA_PORT:-3000}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    secrets:
      - blt_password

  # One shot, like the `seed` service on Railway: creates the repository and the issues.
  gitea-seed:
    image: blt-api
    restart: "no"
    healthcheck:
      disable: true
    environment:
      SERVICE_ROLE: seed
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_USER: ${GITEA_USER:-blt}
      GITEA_REPO: ${GITEA_REPO:-blt/tasks}
      GITEA_ALLOWED_REPOS: ${GITEA_ALLOWED_REPOS:-${GITEA_REPO:-blt/tasks}}
      RUN_MIGRATIONS: "0"
    depends_on:
      gitea:
        condition: service_healthy
      api:
        condition: service_healthy
    secrets:
      - blt_password

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Optional: starts with `make up-full`. MinIO images are built from source,
  # so the first build takes a few minutes.
  minio:
    profiles: [storage]
    build: ./minio
    image: blt-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bltminio}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    secrets:
      - minio_root_password

  minio-init:
    profiles: [storage]
    image: blt-minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: never
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bltminio}
      S3_BUCKET: ${S3_BUCKET:-blt-media}
      MINIO_RO_ACCESS_KEY: ${MINIO_RO_ACCESS_KEY:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Guarded here, not in the YAML: Compose interpolates inactive profiles too.
        : "$${MINIO_RO_ACCESS_KEY:?set MINIO_RO_ACCESS_KEY in .env}"
        MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"
        MINIO_RO_SECRET_KEY="$$(cat /run/secrets/minio_ro_secret)"
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"
        # Read-only user for the MinIO MCP; re-adding an existing user resets its secret.
        mc admin user add local "$${MINIO_RO_ACCESS_KEY}" "$${MINIO_RO_SECRET_KEY}"
        # The built-in `readonly` policy cannot list a bucket, so the MCP would see nothing.
        cat > /tmp/blt-readonly.json <<POLICY
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:ListAllMyBuckets","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::*"]},
          {"Effect":"Allow","Action":["s3:ListBucket"],"Resource":["arn:aws:s3:::$${S3_BUCKET}"]},
          {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$${S3_BUCKET}/*"]}]}
        POLICY
        mc admin policy create local blt-readonly /tmp/blt-readonly.json
        # Attaching twice errors out, hence `|| true`.
        mc admin policy attach local blt-readonly --user "$${MINIO_RO_ACCESS_KEY}" || true
    secrets:
      - minio_root_password
      - minio_ro_secret

  api:
    build: ../api
    image: blt-api
    restart: unless-stopped
    environment:
      DEBUG: "false"
      NUM_PROXIES: "1"
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-blt}
      POSTGRES_USER: ${POSTGRES_USER:-blt}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-BLT <no-reply@blt.local>}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-blt-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bltminio}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/inference/go/openai/v1}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-deepseek-v4.1-flash}
      OPENCODE_TIMEOUT: ${OPENCODE_TIMEOUT:-45}
      SPEC_MAX_INPUT_CHARS: ${SPEC_MAX_INPUT_CHARS:-12000}
      RUN_MIGRATIONS: "1"
      SEED_DATA: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,api,web
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_USER: ${GITEA_USER:-blt}
      GITEA_REPO: ${GITEA_REPO:-blt/tasks}
      GITEA_ALLOWED_REPOS: ${GITEA_ALLOWED_REPOS:-${GITEA_REPO:-blt/tasks}}
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    secrets:
      - django_secret_key
      - postgres_password
      - blt_password
      - minio_root_password
      - opencode_api_key
      - email_host_password

  worker:
    image: blt-api
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true
    environment:
      DEBUG: "false"
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-blt}
      POSTGRES_USER: ${POSTGRES_USER:-blt}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-BLT <no-reply@blt.local>}
      RUN_MIGRATIONS: "0"
    depends_on:
      api:
        condition: service_healthy
    secrets:
      - django_secret_key
      - postgres_password
      - email_host_password

  beat:
    image: blt-api
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    environment:
      DEBUG: "false"
      DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-blt}
      POSTGRES_USER: ${POSTGRES_USER:-blt}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      RUN_MIGRATIONS: "0"
    depends_on:
      api:
        condition: service_healthy
    secrets:
      - django_secret_key
      - postgres_password

  web:
    build: ../web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  giteadata:
  pgdata:
  redisdata:
  miniodata:

# Passwords and keys are files, not environment variables: they do not show up in
# `docker inspect` or in a container's environment. `make env` creates them.
secrets:
  blt_password:
    file: ../secrets/blt_password
  postgres_password:
    file: ../secrets/postgres_password
  django_secret_key:
    file: ../secrets/django_secret_key
  minio_root_password:
    file: ../secrets/minio_root_password
  minio_ro_secret:
    file: ../secrets/minio_ro_secret
  opencode_api_key:
    file: ../secrets/opencode_api_key
  email_host_password:
    file: ../secrets/email_host_password
