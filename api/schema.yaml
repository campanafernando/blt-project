openapi: 3.0.3
info:
  title: BLT API
  version: 0.1.0
  description: Tasks, assignment, due dates and completion.
paths:
  /api/v1/auth/me/:
    get:
      operationId: me
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: list_users
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserBrief'
          description: ''
  /api/v1/specs/:
    get:
      operationId: list_specs
      tags:
      - Specs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Spec'
          description: ''
    post:
      operationId: create_spec
      tags:
      - Specs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spec'
          description: ''
  /api/v1/specs/{spec_id}/:
    get:
      operationId: get_spec
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
        required: true
      tags:
      - Specs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spec'
          description: ''
  /api/v1/specs/{spec_id}/publish/:
    post:
      operationId: publish_spec
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
        required: true
      tags:
      - Specs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Spec'
          description: ''
  /api/v1/specs/{spec_id}/tasks/:
    post:
      operationId: create_spec_tasks
      parameters:
      - in: path
        name: spec_id
        schema:
          type: integer
        required: true
      tags:
      - Specs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecTasksCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SpecTasksCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SpecTasksCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecTasksCreated'
          description: ''
  /api/v1/specs/config/:
    get:
      operationId: spec_config
      tags:
      - Specs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecConfig'
          description: ''
  /api/v1/tasks/:
    get:
      operationId: list_tasks
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
        description: Assignee user id.
      - in: query
        name: due_date_after
        schema:
          type: string
          format: date
        description: Due on or after.
      - in: query
        name: due_date_before
        schema:
          type: string
          format: date
        description: Due on or before.
      - in: query
        name: overdue
        schema:
          type: boolean
        description: Overdue tasks only.
      - in: query
        name: page
        schema:
          type: integer
        description: Page (10 per page).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Up to 100 per page.
      - in: query
        name: search
        schema:
          type: string
        description: Title or description.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - done
          - in_progress
          - todo
        description: Filter by status.
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
    post:
      operationId: create_task
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/:
    get:
      operationId: get_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: update_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: delete_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/{task_id}/assign/:
    post:
      operationId: assign_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/complete/:
    post:
      operationId: complete_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/reopen/:
    post:
      operationId: reopen_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/summary/:
    get:
      operationId: task_summary
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
          description: ''
components:
  schemas:
    PatchedTaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to:
          type: integer
          nullable: true
    SizeEnum:
      enum:
      - S
      - M
      - L
      type: string
      description: |-
        * `S` - S
        * `M` - M
        * `L` - L
    Spec:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue_url:
          type: string
          format: uri
          readOnly: true
        repo:
          type: string
          readOnly: true
        issue_number:
          type: integer
          readOnly: true
        issue_title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        acceptance_criteria:
          readOnly: true
        implementation_steps:
          readOnly: true
        risks:
          readOnly: true
        out_of_scope:
          readOnly: true
        size:
          allOf:
          - $ref: '#/components/schemas/SizeEnum'
          readOnly: true
        body_markdown:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        prompt_version:
          type: string
          readOnly: true
        latency_ms:
          type: integer
          readOnly: true
        input_chars:
          type: integer
          readOnly: true
        truncated:
          type: boolean
          readOnly: true
        published:
          type: boolean
          readOnly: true
        published_issue_url:
          type: string
          format: uri
          readOnly: true
        published_issue_number:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - acceptance_criteria
      - body_markdown
      - created_at
      - id
      - implementation_steps
      - input_chars
      - issue_number
      - issue_title
      - issue_url
      - latency_ms
      - model
      - out_of_scope
      - prompt_version
      - published
      - published_issue_number
      - published_issue_url
      - repo
      - risks
      - size
      - summary
      - truncated
    SpecConfig:
      type: object
      properties:
        ai_enabled:
          type: boolean
        publish_enabled:
          type: boolean
      required:
      - ai_enabled
      - publish_enabled
    SpecCreateRequest:
      type: object
      properties:
        issue_url:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - issue_url
    SpecTasksCreateRequest:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskCreateRequest'
      required:
      - tasks
    SpecTasksCreated:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - tasks
    StatusEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - To do
        * `in_progress` - In progress
        * `done` - Done
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to
      - completed_at
      - created_at
      - created_by
      - description
      - due_date
      - id
      - is_overdue
      - status
      - status_display
      - title
      - updated_at
    TaskAssignRequest:
      type: object
      properties:
        user:
          type: integer
      required:
      - user
    TaskCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to:
          type: integer
          nullable: true
      required:
      - title
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        todo:
          type: integer
        in_progress:
          type: integer
        done:
          type: integer
        overdue:
          type: integer
      required:
      - done
      - in_progress
      - overdue
      - todo
      - total
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
      required:
      - email
      - first_name
      - id
      - is_active
      - last_name
      - username
    UserBrief:
      type: object
      description: 'Directory entry: no contact or status data for other users.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - first_name
      - id
      - last_name
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
