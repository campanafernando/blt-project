openapi: 3.0.3
info:
  title: BLT API
  version: 0.1.0
  description: Tarefas, atribuição, prazos e conclusão.
paths:
  /api/v1/auth/me/:
    get:
      operationId: me
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: v1_auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/users/:
    get:
      operationId: list_users
      tags:
      - Auth
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/v1/tasks/:
    get:
      operationId: list_tasks
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
        description: ID do responsável.
      - in: query
        name: due_date_after
        schema:
          type: string
          format: date
        description: Vence a partir de.
      - in: query
        name: due_date_before
        schema:
          type: string
          format: date
        description: Vence até.
      - in: query
        name: overdue
        schema:
          type: boolean
        description: Somente atrasadas.
      - in: query
        name: page
        schema:
          type: integer
        description: Página (10 por página).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Até 100 por página.
      - in: query
        name: search
        schema:
          type: string
        description: Título ou descrição.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - done
          - in_progress
          - todo
        description: Filtra por status.
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
          description: ''
    post:
      operationId: create_task
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/:
    get:
      operationId: get_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    patch:
      operationId: update_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTaskUpdateRequest'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
    delete:
      operationId: delete_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/{task_id}/assign/:
    post:
      operationId: assign_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/complete/:
    post:
      operationId: complete_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/{task_id}/reopen/:
    post:
      operationId: reopen_task
      parameters:
      - in: path
        name: task_id
        schema:
          type: integer
        required: true
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: ''
  /api/v1/tasks/summary/:
    get:
      operationId: task_summary
      tags:
      - Tasks
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
          description: ''
components:
  schemas:
    PatchedTaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to:
          type: integer
          nullable: true
    StatusEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - A fazer
        * `in_progress` - Em andamento
        * `done` - Concluída
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        due_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        assigned_to:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to
      - completed_at
      - created_at
      - created_by
      - description
      - due_date
      - id
      - is_overdue
      - status
      - status_display
      - title
      - updated_at
    TaskAssignRequest:
      type: object
      properties:
        user:
          type: integer
      required:
      - user
    TaskCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
        assigned_to:
          type: integer
          nullable: true
      required:
      - title
    TaskSummary:
      type: object
      properties:
        total:
          type: integer
        todo:
          type: integer
        in_progress:
          type: integer
        done:
          type: integer
        overdue:
          type: integer
      required:
      - done
      - in_progress
      - overdue
      - todo
      - total
    TokenObtainPair:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenObtainPairRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        first_name:
          type: string
          readOnly: true
          title: Primeiro nome
        last_name:
          type: string
          readOnly: true
          title: Último nome
        email:
          type: string
          format: email
          readOnly: true
          title: Endereço de email
        is_active:
          type: boolean
          readOnly: true
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
      required:
      - email
      - first_name
      - id
      - is_active
      - last_name
      - username
    UserBrief:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
        first_name:
          type: string
          readOnly: true
          title: Primeiro nome
        last_name:
          type: string
          readOnly: true
          title: Último nome
      required:
      - first_name
      - id
      - last_name
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
