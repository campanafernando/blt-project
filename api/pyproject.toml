[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E203", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "core", "hypermedia", "tasks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tasks/tests", "specs/tests", "accounts/tests", "core/tests", "hypermedia/tests"]
addopts = [
    "-q",
    "--cov=accounts",
    "--cov=tasks",
    "--cov=specs",
    "--cov=hypermedia",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
