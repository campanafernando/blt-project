[project]
name = "blt-api"
version = "0.1.0"
description = "BLT task manager API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "djangorestframework>=3.18,<3.19",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.29,<0.30",
    "django-filter>=25.1,<26",
    "django-cors-headers>=4.7,<5",
    "django-storages[s3]>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "celery[redis]>=5.5,<6",
    "redis>=6,<7",
    "python-dotenv>=1.1,<2",
    "httpx>=0.27,<1",
    "gunicorn>=23,<27",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
    "freezegun>=1.5,<2",
    "mcp>=1.2,<2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E203", "B008"]

[tool.ruff.lint.per-file-ignores]
# Django must be configured (sys.path, django.setup) before the models can be imported.
"../mcp_server/server.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "core", "hypermedia", "specs", "tasks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tasks/tests", "specs/tests", "accounts/tests", "core/tests", "hypermedia/tests"]
addopts = [
    "-q",
    "--cov=accounts",
    "--cov=tasks",
    "--cov=specs",
    "--cov=hypermedia",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
