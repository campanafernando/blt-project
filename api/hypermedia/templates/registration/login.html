{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · BLT</title>
    <link rel="icon" href="{% static 'hypermedia/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'hypermedia/favicon.ico' %}" sizes="48x48">
    <link rel="apple-touch-icon" href="{% static 'hypermedia/apple-touch-icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'hypermedia/app.css' %}">
  </head>
  <body class="login-body">
    <main class="login-card panel">
      <p class="eyebrow">BLT</p>
      <h1>Sign in</h1>
      <p class="lede">Sign in to manage your tasks.</p>
      <form method="post" class="login-form">
        {% csrf_token %}
        {% if form.errors %}
          <p class="error">Invalid username or password.</p>
        {% endif %}
        <label class="field-group">
          <span class="field-label">Username</span>
          <input class="field" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field-group">
          <span class="field-label">Password</span>
          <input class="field" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
