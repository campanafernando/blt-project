<form id="task-form"
      hx-post="{% url 'hypermedia:create' %}"
      hx-target="#task-form"
      hx-swap="outerHTML">
  {% csrf_token %}
  <div class="form-grid">
    <label class="field-group span-2">
      <span class="field-label">Title</span>
      <input class="field" name="title" maxlength="200" required
             value="{{ request.POST.title|default:'' }}" autofocus>
      {% if errors.title %}<span class="error">{{ errors.title.0 }}</span>{% endif %}
    </label>
    <label class="field-group span-2">
      <span class="field-label">Description</span>
      <textarea class="field" name="description" rows="3">{{ request.POST.description|default:'' }}</textarea>
    </label>
    <label class="field-group">
      <span class="field-label">Due date</span>
      <input class="field" type="date" name="due_date" value="{{ request.POST.due_date|default:'' }}">
      {% if errors.due_date %}<span class="error">{{ errors.due_date.0 }}</span>{% endif %}
    </label>
    <label class="field-group">
      <span class="field-label">Assignee</span>
      <input class="field" name="assigned_to" inputmode="numeric"
             placeholder="User ID (optional)" value="{{ request.POST.assigned_to|default:'' }}">
      {% if errors.assigned_to %}<span class="error">{{ errors.assigned_to.0 }}</span>{% endif %}
    </label>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Create task</button>
    <span class="hint mono">Assigning sends an email via Celery</span>
  </div>
</form>
