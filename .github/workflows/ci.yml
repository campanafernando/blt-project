name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blt
          POSTGRES_USER: blt
          POSTGRES_PASSWORD: blt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U blt -d blt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DEBUG: "false"
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
      DB_ENGINE: postgres
      POSTGRES_DB: blt
      POSTGRES_USER: blt
      POSTGRES_PASSWORD: blt
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Django checks
        run: python manage.py check
      - name: Tests
        run: python -m pytest
      - name: OpenAPI schema
        run: python manage.py spectacular --file schema.yaml --validate --fail-on-warn
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
