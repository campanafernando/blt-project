name: blt

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blt}
      POSTGRES_USER: ${POSTGRES_USER:-blt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blt} -d ${POSTGRES_DB:-blt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gitea:
    image: gitea/gitea:1.24.6
    restart: unless-stopped
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__SSH_LISTEN_PORT: "22"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    ports:
      - "127.0.0.1:${GITEA_PORT:-3000}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - giteadata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  gitea-secrets:
    image: alpine:3.22
    restart: "no"
    command: ["sh", "-c", "mkdir -p /secrets && chown 1000:1000 /secrets && chmod 755 /secrets"]
    volumes:
      - giteasecrets:/secrets

  gitea-init:
    image: gitea/gitea:1.24.6
    restart: "no"
    user: "1000:1000"
    depends_on:
      gitea:
        condition: service_healthy
      gitea-secrets:
        condition: service_completed_successfully
    environment:
      GITEA_WORK_DIR: /data
      GITEA_USER: ${GITEA_USER:-blt}
      GITEA_PASSWORD: ${GITEA_PASSWORD:?defina GITEA_PASSWORD no .env}
      GITEA_EMAIL: ${GITEA_EMAIL:-blt@example.com}
    volumes:
      - giteadata:/data
      - giteasecrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        gitea admin user create --admin --username "$$GITEA_USER" --password "$$GITEA_PASSWORD" --email "$$GITEA_EMAIL" --must-change-password=false \
          || gitea admin user change-password --username "$$GITEA_USER" --password "$$GITEA_PASSWORD"
        if [ ! -s /secrets/gitea_token ]; then
          gitea admin user generate-access-token --username "$$GITEA_USER" --token-name blt-api --scopes all \
            | sed 's/^.*: //' > /secrets/gitea_token
          chmod 644 /secrets/gitea_token
        fi

  gitea-seed:
    image: blt-api
    restart: "no"
    healthcheck:
      disable: true
    env_file: .env
    environment:
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_TOKEN_FILE: /secrets/gitea_token
      RUN_MIGRATIONS: "0"
    volumes:
      - giteasecrets:/secrets:ro
    command: ["python", "manage.py", "gitea_bootstrap"]
    depends_on:
      gitea:
        condition: service_healthy
      gitea-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Optional: starts with `make up-full`. MinIO images are built from source,
  # so the first build takes a few minutes.
  minio:
    profiles: [storage]
    build: ./infra/minio
    image: blt-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bltminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    profiles: [storage]
    image: blt-minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: never
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bltminio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-blt-media}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set none "local/$${S3_BUCKET}"

  api:
    build: ./api
    image: blt-api
    restart: unless-stopped
    env_file: .env
    environment:
      DEBUG: "false"
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      S3_ENDPOINT: http://minio:9000
      RUN_MIGRATIONS: "1"
      SEED_DEMO: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,api,web
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_TOKEN_FILE: /secrets/gitea_token
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - giteasecrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    image: blt-api
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
      S3_ENDPOINT: http://minio:9000
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_TOKEN_FILE: /secrets/gitea_token
      RUN_MIGRATIONS: "0"
    volumes:
      - giteasecrets:/secrets:ro
    depends_on:
      api:
        condition: service_healthy

  beat:
    image: blt-api
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
      GITEA_API_URL: http://gitea:3000/api/v1
      GITEA_URL: http://localhost:3000
      GITEA_TOKEN_FILE: /secrets/gitea_token
      RUN_MIGRATIONS: "0"
    volumes:
      - giteasecrets:/secrets:ro
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  giteadata:
  giteasecrets:
  pgdata:
  redisdata:
  miniodata:
